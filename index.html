  <body>
    <div id="view"><canvas id="c"></canvas></div>
    <div id="panel">
      <h1>Mesh Enclosure Lab</h1>
      <small>Exact-CCD constrained descent around a keep-out volume.</small>

      <h2>Run</h2>
      <div class="row">
        <button id="run">▶ Run</button>
        <button id="stepBtn">Step</button>
        <button id="reset">Reset</button>
      </div>
      <label
        >Optimizer
        <select id="opt">
          <option value="adam">Adam</option>
          <option value="lbfgs">L-BFGS</option>
          <option value="qqn">QQN</option>
        </select>
      </label>
      <label
        >Learn rate <input id="lr" type="number" step="0.001" value="0.02" style="width: 70px"
      /></label>
      <label
        >Steps/frame <input id="spf" type="number" value="1" min="1" style="width: 70px"
      /></label>

      <h2>Energy weights</h2>
      <div id="weights"></div>
      <label
        >Target Vol <input id="vstar" type="number" step="0.5" value="0" style="width: 70px"
      /></label>

      <h2>Constraints</h2>
      <label
        >δ_safe <input id="dsafe" type="range" min="0" max="0.2" step="0.005" value="0.05" /><span
          class="val"
          id="dsafeV"
        ></span
      ></label>
      <label><span>Self-collision (approx)</span><input id="selfcc" type="checkbox" /></label>
      <label
        ><span>Reset optimizer on truncation</span><input id="resetOpt" type="checkbox" checked
      /></label>
      <button id="retri">Retriangulate (edge flips)</button>

      <h2>Metrics</h2>
      <div id="metrics"></div>
    </div>

    <script src="./js/tf.min.js"></script>
    <script src="./js/experiments-mesh-index.js" type="module"></script>
